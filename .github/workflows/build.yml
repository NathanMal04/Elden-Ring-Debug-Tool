name: build

on: push

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    # Several files required by Erd-Tools are not committed to the Erd-Tools submodule upstream
    # (Nordgaren builds with them present locally). We vendor them under third_party/ and drop
    # them into the submodule's expected paths before restore. See third_party/README.md for
    # provenance. Covers: FSParam + StudioUtils (net6-retargeted), and the EquipParamWeapon
    # param-def class (Models/Params/Defs) that ErdHook references.
    - name: vendor missing Erd-Tools dependencies into submodule
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path src/Erd-Tools/src/FSParam | Out-Null
        New-Item -ItemType Directory -Force -Path src/Erd-Tools/src/StudioUtils | Out-Null
        New-Item -ItemType Directory -Force -Path src/Erd-Tools/src/Erd-Tools/Models/Params/Defs | Out-Null
        Copy-Item -Path third_party/FSParam/*      -Destination src/Erd-Tools/src/FSParam      -Recurse -Force
        Copy-Item -Path third_party/StudioUtils/*  -Destination src/Erd-Tools/src/StudioUtils  -Recurse -Force
        Copy-Item -Path third_party/ErdToolsDefs/* -Destination src/Erd-Tools/src/Erd-Tools/Models/Params/Defs -Recurse -Force

    - name: restore dependencies
      run: dotnet restore
      
    - name: build
      run: dotnet publish "src/Elden-Ring-Debug-Tool-WPF/Elden-Ring-Debug-Tool-WPF.csproj" /p:PublishProfile=FolderProfile.pubxml

    - name: Zip up files
      run: 7z a -t7z "Elden Ring Debug Tool.7z" ./src/Elden-Ring-Debug-Tool-WPF/bin/Publish/win-x64/* -xr!*.pdb
      shell: cmd
    # - uses: grez72/action-zip-7z@v0.1.0
    #   with:
    #     args: 7z a -t7z 'Elden Ring Debug Tool.7z' src/Elden-Ring-Debug-Tool-WPF/bin/Publish/win-x64/* -xr!*.pdb

    - name: get-net-sdk-project-versions-action
      uses: kzrnm/get-net-sdk-project-versions-action@v1.1.1
      id: get-version
      with:
        proj-path: src/Elden-Ring-Debug-Tool-WPF/Elden-Ring-Debug-Tool-WPF.csproj


    - name: move zipped file and rename
      run: move 'Elden Ring Debug Tool.7z' './src/Elden-Ring-Debug-Tool-WPF/bin/Publish/Elden Ring Debug Tool ${{steps.get-version.outputs.assembly-version}}.7z'

    - name: publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: publish
        path: src/Elden-Ring-Debug-Tool-WPF/bin/Publish/Elden Ring Debug Tool ${{steps.get-version.outputs.assembly-version}}.7z

    
